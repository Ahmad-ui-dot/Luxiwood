packages:
  - apps/*
  - packages/*

# Пакеты, которым разрешено запускать install-скрипты (pnpm 10 по умолчанию их блокирует)
onlyBuiltDependencies:
  - sharp
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - bcrypt
  - esbuild
  - prisma

# Скрипт сбора аналитики из swagger-ui — не нужен
ignoredBuiltDependencies:
  - unrs-resolver
  - "@scarf/scarf"
