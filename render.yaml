# Render Blueprint: база PostgreSQL и API (NestJS).
# Render → New → Blueprint → выбрать этот репозиторий. Значения с sync: false Render спросит при создании.
databases:
  - name: luxiwood-db
    plan: free
    region: frankfurt
    databaseName: luxiwood
    user: luxiwood

services:
  - type: web
    name: luxiwood-api
    runtime: node
    plan: free
    region: frankfurt
    # --prod=false: для сборки нужны devDependencies (nest, prisma, tsx), а NODE_ENV=production их бы пропустил
    buildCommand: npm install -g pnpm@10.34.7 && pnpm install --frozen-lockfile --prod=false && pnpm build:shared && pnpm --filter @luxiwood/api build
    # При каждом запуске: применяем миграции и добавляем недостающие данные (seed ничего не дублирует)
    startCommand: pnpm --filter @luxiwood/api db:deploy && pnpm --filter @luxiwood/api db:seed && pnpm --filter @luxiwood/api start
    healthCheckPath: /api/settings/public
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: luxiwood-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@luxiwood.tj
      - key: ADMIN_PASSWORD
        sync: false
      # Адрес сайта (фронтенда); несколько — через запятую
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SWAGGER_ENABLED
        value: "false"
